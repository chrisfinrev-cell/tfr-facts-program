<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invite Friends — FACTS</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0f1a; color: #e8e4d8; font-family: Inter, "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; }
    .wrap { max-width: 680px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.6rem; color: #e8c96a; margin-bottom: 6px; }
    .lead { color: #94a3b8; line-height: 1.55; margin-bottom: 24px; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 22px; margin-bottom: 20px; }
    .label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.6rem; font-weight: 800; color: #e8c96a; letter-spacing: 0.04em; }
    .link { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; color: #cbd5e1; word-break: break-all; margin: 6px 0 14px; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .count { font-size: 2rem; font-weight: 800; color: #c9a227; }
    .count-label { color: #94a3b8; font-size: 0.9rem; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-top: 8px; }
    label { display: block; font-size: 0.75rem; color: #cbd5e1; margin-bottom: 6px; }
    .field { flex: 1 1 200px; }
    input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #0a0f1a; color: #f1f5f9; font-size: 1rem; }
    .btn { background: linear-gradient(135deg, #c9a227, #e8c96a); color: #0d1117; font-weight: 700; border: none; border-radius: 8px; padding: 11px 18px; cursor: pointer; font-size: 0.95rem; }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .btn-ghost { background: none; border: 1px solid #334155; color: #cbd5e1; font-weight: 600; padding: 9px 14px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; }
    .btn-ghost:hover { border-color: #c9a227; color: #e8c96a; }
    #result { margin-top: 12px; min-height: 1.2em; font-size: 0.9rem; }
  </style>
  <script defer src="/nav-bar.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>Invite Friends to the Beta</h1>
    <p class="lead">Share your referral code or link. During the beta, your code can bring in 5 people each month.</p>

    <div class="card">
      <div class="label">Your referral code</div>
      <div class="code" id="ref-code">—</div>
      <div class="link" id="ref-link"></div>
      <div class="row">
        <button class="btn-ghost" type="button" id="copy-code">Copy Code</button>
        <button class="btn-ghost" type="button" id="copy-link">Copy Link</button>
      </div>
    </div>

    <div class="card">
      <div class="count" id="remaining">—</div>
      <div class="count-label" id="remaining-label">signups left this month</div>
      <form id="send-form">
        <div class="field">
          <label for="invite-name">Name (optional)</label>
          <input id="invite-name" type="text" placeholder="Jane Doe" autocomplete="off">
        </div>
        <div class="field">
          <label for="invite-email">Email</label>
          <input id="invite-email" type="email" placeholder="jane@example.com" required autocomplete="off">
        </div>
        <button class="btn" type="submit" id="send-btn">Email My Link</button>
      </form>
      <p id="result"></p>
    </div>
  </div>

  <script>
    var current = { code: '', link: '' };

    function showResult(message, color) {
      var el = document.getElementById('result');
      el.style.color = color || '#cbd5e1';
      el.textContent = message;
    }

    function copyText(text) {
      if (!text) return;
      function done() { showResult('Copied. Paste it into a text or email.', '#6ee7b7'); }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(function () { fallback(text); done(); });
      } else {
        fallback(text);
        done();
      }
    }

    function fallback(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }

    async function load() {
      try {
        var res = await fetch('/api/mod_beta_invites/mine', { credentials: 'same-origin' });
        if (res.status === 401) { window.location.href = '/login.html?next=/invites.html'; return; }
        var data = await res.json();
        if (!data.success) throw new Error(data.error || 'Could not load your referral code.');
        current.code = data.code || '';
        current.link = data.link || '';
        document.getElementById('ref-code').textContent = current.code || '—';
        document.getElementById('ref-link').textContent = current.link;

        var remainingEl = document.getElementById('remaining');
        var labelEl = document.getElementById('remaining-label');
        if (!data.betaInviteOnly || data.unlimited) {
          remainingEl.textContent = 'No limit';
          labelEl.textContent = data.unlimited ? 'on your code' : 'signups are open to everyone';
        } else {
          remainingEl.textContent = data.remaining + ' of ' + data.limit;
          labelEl.textContent = 'signups left this month';
        }
      } catch (err) {
        showResult(err.message, '#fca5a5');
      }
    }

    document.getElementById('copy-code').addEventListener('click', function () { copyText(current.code); });
    document.getElementById('copy-link').addEventListener('click', function () { copyText(current.link); });

    document.getElementById('send-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      var nameEl = document.getElementById('invite-name');
      var emailEl = document.getElementById('invite-email');
      var btn = document.getElementById('send-btn');
      btn.disabled = true;
      try {
        var res = await fetch('/api/mod_beta_invites/send', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: nameEl.value.trim(), email: emailEl.value.trim() })
        });
        var data = await res.json().catch(function () { return {}; });
        if (data.success) {
          showResult(data.message, data.emailSent ? '#6ee7b7' : '#fbbf24');
          nameEl.value = '';
          emailEl.value = '';
        } else {
          showResult(data.error || 'Could not send that invite.', '#fca5a5');
        }
      } catch (err) {
        showResult('Could not reach the server. Try again.', '#fca5a5');
      } finally {
        btn.disabled = false;
      }
    });

    load();
  </script>
  <script defer src="/legal-disclaimer.js"></script>
</body>
</html>
