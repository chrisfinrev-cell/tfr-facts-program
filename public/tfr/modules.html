<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modules — The Financial Revolution</title>
  <meta name="description" content="Catalog of FACTS modules: AI Coach, Rate Radar, Forensic Credit, Shopping, Friday Sweep, HELOC Velocity, Legacy Lens, Lending, Vault, Household.">
  <link rel="icon" type="image/png" href="tfr-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tfr.css">
  <script src="/tfr-host-gate.js"></script>
</head>
<body>
<script src="tfr-nav.js"></script>

<section class="hero" style="padding-bottom:2rem;">
  <div class="wrap">
    <div class="eyebrow">Modules</div>
    <h1>What each piece of the system does.</h1>
    <p class="lede">This catalog explains the modules. The live controls — linking banks, sweeping surplus, scoring XP — stay on factsmoney.com.</p>
  </div>
</section>

<section class="wrap section" style="padding-top:0;">
  <div class="grid-3" id="grid"></div>
  <p class="disclaimer">Elite modules require the matching FACTS tier. Descriptions here are educational. Activation and billing happen in the engine.</p>
</section>

<script src="catalog.js"></script>
<script>
(function () {
  var mods = (window.TFR_CATALOG && TFR_CATALOG.modules) || [];
  var grid = document.getElementById('grid');
  mods.forEach(function (m) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = m.href;
    var chip = m.status === 'elite' ? 'elite' : (m.status === 'tool' ? 'public' : 'engine');
    a.innerHTML =
      '<span class="chip ' + chip + '">' + m.status + '</span>' +
      '<div class="icon">' + m.icon + '</div>' +
      '<h3>' + m.title + '</h3>' +
      '<p>' + m.desc + '</p>' +
      '<div class="meta">' + (m.status === 'tool' ? 'Public tool' : 'Opens in FACTS') + '</div>';
    grid.appendChild(a);
  });
})();
</script>
<script defer src="/legal-disclaimer.js"></script>
<script src="/js/global-footer.js"></script>
</body>
</html>
