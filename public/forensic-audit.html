<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FACTS — Forensic Baseline Audit</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1e293b 0%, #020617 55%);
      color: #e2e8f0;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="statement-uploader"></div>
  <script src="/statement-uploader.js"></script>
  <script>
    var params = new URLSearchParams(window.location.search);
    mountStatementUploader(document.getElementById('statement-uploader'), {
      userId: params.get('userId') || undefined,
      onAuditComplete: function (data) {
        console.log('[Forensic] audit complete', data);
      }
    });
  </script>
</body>
</html>
