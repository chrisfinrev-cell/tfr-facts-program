<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACTSâ„¢ â€” Coaching Readiness Assessment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Tailwind CDN fallback â€” privacy browsers (DuckDuckGo, Brave) block the CDN. */
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .max-w-xl { max-width: 36rem; }
    .w-full { width: 100%; }
    .bg-slate-800 { background: #1e293b; }
    .bg-slate-900 { background: #0f172a; }
    .rounded-xl { border-radius: 0.75rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded { border-radius: 0.25rem; }
    .border { border: 1px solid #334155; }
    .border-slate-700 { border-color: #334155; }
    .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
    .p-6 { padding: 1.5rem; }
    .p-4 { padding: 1rem; }
    .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
    .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
    .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
    .pb-4 { padding-bottom: 1rem; }
    .mb-6 { margin-bottom: 1.5rem; }
    .mt-1 { margin-top: 0.25rem; }
    .mt-6 { margin-top: 1.5rem; }
    .flex { display: flex; }
    .hidden { display: none !important; }
    .justify-between { justify-content: space-between; }
    .block { display: block; }
    .space-y-4 > * + * { margin-top: 1rem; }
    .space-y-2 > * + * { margin-top: 0.5rem; }
    .text-xl { font-size: 1.25rem; }
    .text-sm { font-size: 0.875rem; }
    .text-xs { font-size: 0.75rem; }
    .font-bold { font-weight: 700; }
    .font-semibold { font-weight: 600; }
    .font-medium { font-weight: 500; }
    .uppercase { text-transform: uppercase; }
    .text-white { color: #fff; }
    .text-slate-100 { color: #f1f5f9; }
    .text-slate-300 { color: #cbd5e1; }
    .text-slate-400 { color: #94a3b8; }
    .text-indigo-400 { color: #818cf8; }
    .text-emerald-400 { color: #34d399; }
    .text-rose-400 { color: #fb7185; }
    .bg-indigo-600 { background: #4f46e5; color: #fff; }
    button { cursor: pointer; font-family: inherit; }
    button:hover { filter: brightness(1.08); }
    input { font-family: inherit; }
    a { color: #818cf8; }
    #status-msg { min-height: 1.25rem; font-size: 0.8rem; margin-top: 0.75rem; }
    #status-msg.error { color: #fb7185; }
    #status-msg.ok { color: #34d399; }
    @media (min-width: 768px) {
      .md\:p-8 { padding: 2rem; }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xl w-full bg-slate-800 rounded-xl border border-slate-700 shadow-2xl p-6 md:p-8">
    <div class="border-b border-slate-700 pb-4 mb-6">
      <h1 class="text-xl font-bold text-white">Coaching Readiness Rubric</h1>
      <p class="text-xs text-slate-400">100-Point Behavioral &amp; Alignment Assessment</p>
      <p class="text-xs text-slate-400" style="margin-top:4px;">
        <a href="/app.html">â† Back to dashboard</a>
        &nbsp;Â·&nbsp;
        <a href="/paycheck-entry.html">Paycheck Engine</a>
      </p>
    </div>
    <form id="coaching-form" onsubmit="submitRubric(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase" for="pain_point_clarity">1. Pain Point Clarity (0â€“25)</label>
        <input type="number" id="pain_point_clarity" min="0" max="25" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white mt-1">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase" for="systems_orientation">2. Systems Orientation (0â€“20)</label>
        <input type="number" id="systems_orientation" min="0" max="20" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white mt-1">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase" for="accountability">3. Accountability (0â€“25)</label>
        <input type="number" id="accountability" min="0" max="25" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white mt-1">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase" for="implementation_speed">4. Implementation Speed (0â€“15)</label>
        <input type="number" id="implementation_speed" min="0" max="15" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white mt-1">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase" for="value_alignment">5. Value Alignment (0â€“15)</label>
        <input type="number" id="value_alignment" min="0" max="15" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white mt-1">
      </div>
      <p class="text-xs text-slate-400">Running total: <span id="live-total">0</span> / 100</p>
      <button type="submit" id="btn-evaluate" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition mt-6">Evaluate Readiness</button>
    </form>
    <div id="result-box" class="mt-6 hidden bg-slate-900 p-4 rounded-lg border border-slate-700 space-y-2">
      <div class="flex justify-between text-sm">
        <span class="text-slate-400">Total Score:</span>
        <span id="res-score" class="font-bold text-white">0 / 100</span>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-slate-400">Qualification Tier:</span>
        <span id="res-tier" class="font-bold text-indigo-400">---</span>
      </div>
      <p id="res-notice" class="text-xs text-slate-400"></p>
    </div>
    <p id="status-msg" role="status"></p>
  </div>
  <script src="/legal-disclaimer.js"></script>
  <script>
    var TIER_LABELS = {
      PRIME_CANDIDATE: 'Prime Candidate',
      MODERATE_FIT: 'Moderate Fit',
      LOW_FIT: 'Low Fit'
    };
    var FIELDS = [
      ['pain_point_clarity', 25],
      ['systems_orientation', 20],
      ['accountability', 25],
      ['implementation_speed', 15],
      ['value_alignment', 15]
    ];

    function setStatus(text, kind) {
      var el = document.getElementById('status-msg');
      el.textContent = text || '';
      el.className = kind || '';
    }

    function updateLiveTotal() {
      var total = 0;
      FIELDS.forEach(function (pair) {
        var n = parseInt(document.getElementById(pair[0]).value, 10);
        if (!isFinite(n) || n < 0) n = 0;
        if (n > pair[1]) n = pair[1];
        total += n;
      });
      document.getElementById('live-total').textContent = String(total);
    }

    FIELDS.forEach(function (pair) {
      document.getElementById(pair[0]).addEventListener('input', updateLiveTotal);
    });

    async function submitRubric(e) {
      e.preventDefault();
      setStatus('');
      var payload = {
        pain_point_clarity: parseInt(document.getElementById('pain_point_clarity').value, 10) || 0,
        systems_orientation: parseInt(document.getElementById('systems_orientation').value, 10) || 0,
        accountability: parseInt(document.getElementById('accountability').value, 10) || 0,
        implementation_speed: parseInt(document.getElementById('implementation_speed').value, 10) || 0,
        value_alignment: parseInt(document.getElementById('value_alignment').value, 10) || 0
      };
      var btn = document.getElementById('btn-evaluate');
      btn.disabled = true;
      try {
        var res = await fetch('/api/mod_coaching/readiness', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify(payload)
        });
        if (res.status === 401) {
          window.location.href = '/login.html?next=/coaching-readiness.html';
          return;
        }
        var data = {};
        try { data = await res.json(); } catch (err) { data = {}; }
        if (!res.ok) {
          setStatus(data.error || 'Could not evaluate readiness.', 'error');
          return;
        }
        document.getElementById('res-score').innerText = (data.total_score || 0) + ' / 100';
        var tier = data.qualification_tier || 'EVALUATED';
        document.getElementById('res-tier').innerText = TIER_LABELS[tier] || tier;
        document.getElementById('res-tier').className = 'font-bold ' + (
          tier === 'PRIME_CANDIDATE' ? 'text-emerald-400' :
          tier === 'LOW_FIT' ? 'text-rose-400' : 'text-indigo-400'
        );
        document.getElementById('res-notice').textContent = data.notice || '';
        document.getElementById('result-box').classList.remove('hidden');
        if (data.saved_id) {
          setStatus('Score saved to your coaching record.', 'ok');
        } else {
          setStatus('Evaluated. Log in to save this score to your record.', 'ok');
        }
      } catch (err) {
        setStatus('Network error â€” try again.', 'error');
      } finally {
        btn.disabled = false;
      }
    }
  </script>
<script src="/js/global-footer.js"></script>
</body>
</html>
