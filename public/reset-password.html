    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-deep: #0a0f1a;
            --bg-card: #111827;
            --bg-elevated: #1a2332;
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-rose: #f43f5e;
            --accent-cyan: #06b6d4;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; }

        .ambient {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .ambient::before {
            content: ''; position: absolute; top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%);
            border-radius: 50%;
        }
        .ambient::after {
            content: ''; position: absolute; bottom: -10%; left: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(59,130,246,0.06) 0%, transparent 70%);
            border-radius: 50%;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 36px;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 2rem;
            color: var(--accent-green);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .logo p {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 400;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            text-align: center;
        }

        .page-description {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 32px;
            text-align: center;
        }

        .error-message {
            display: none;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid var(--accent-rose);
            color: var(--accent-rose);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .success-message {
            display: none;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--accent-green);
            color: var(--accent-green);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .form-group input:focus {
            border-color: var(--accent-green);
        }

        .password-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.4;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 4px;
        }

        .submit-btn:hover:not(:disabled) {
            background: #0ea271;
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
        }

        .footer p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .footer a {
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .footer a:hover {
            color: #0ea271;
        }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: var(--text-secondary);
        }

        /* Android Chrome: 100vh includes address bar, making content unreachable.
           Switch to top-aligned scrollable layout on mobile/tablet. */
        @media (max-width: 768px) {
            body {
                align-items: flex-start;
                padding-top: 32px;
                padding-bottom: 40px;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 36px 24px;
            }
        }
    </style>
    <script defer src="/nav-bar.js"></script>
</head>
<body>
    <div class="ambient"></div>

    <div class="card">
        <div class="logo">
            <h1>FACTS</h1>
            <p>by FACTS</p>
        </div>

        <h2 class="page-title">Set New Password</h2>
        <p class="page-description">
            Enter a new password for your account.
        </p>

        <div class="error-message" id="error-message"></div>
        <div class="success-message" id="success-message"></div>

        <form id="reset-form" novalidate>
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter new password" autocomplete="new-password">
                <div class="password-hint">Must be at least 10 characters with at least 1 letter and 1 number</div>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required placeholder="Re-enter password" autocomplete="new-password">
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">Reset Password</button>
        </form>

        <div class="footer">
            <p><a href="/login.html">Back to login</a></p>
            <a href="/" class="back-link">Back to home</a>
        </div>
    </div>

    <script>
        (function() {
            // Extract token from URL
            var urlParams = new URLSearchParams(window.location.search);
            var token = urlParams.get('token');

            if (!token) {
                showError('Invalid reset link. Please request a new password reset.');
                document.getElementById('reset-form').style.display = 'none';
                return;
            }

            var form = document.getElementById('reset-form');
            var submitBtn = document.getElementById('submit-btn');
            var errorEl = document.getElementById('error-message');
            var successEl = document.getElementById('success-message');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                var password = document.getElementById('password').value;
                var confirmPassword = document.getElementById('confirm-password').value;

                // Client-side validation
                if (!password || password.length < 10) {
                    showError('Password must be at least 10 characters long.');
                    return;
                }

                if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                    showError('Password must contain at least one letter and one number.');
                    return;
                }

                if (password !== confirmPassword) {
                    showError('Passwords do not match.');
                    return;
                }

                errorEl.style.display = 'none';
                successEl.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.textContent = 'Resetting...';

                fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, password: password })
                })
                .then(function(res) {
                    return res.json();
                })
                .then(function(data) {
                    if (data.success) {
                        showSuccess(data.message || 'Password reset successful! Redirecting to login...');
                        form.style.display = 'none';
                        setTimeout(function() {
                            window.location.href = '/login.html';
                        }, 2000);
                    } else {
                        showError(data.error || 'Something went wrong. Please try again.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Reset Password';
                    }
                })
                .catch(function(err) {
                    showError('Something went wrong. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                });
            });

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
                successEl.style.display = 'none';
            }

            function showSuccess(msg) {
                successEl.textContent = msg;
                successEl.style.display = 'block';
                errorEl.style.display = 'none';
            }
        })();
    </script>

    <script>
    (function() {
        var slug = 'financial-revolution';
        if (!slug || slug === '__POLSIA_' + 'SLUG__') return;
        var vid = localStorage.getItem('polsia_vid');
        if (!vid) {
            vid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            localStorage.setItem('polsia_vid', vid);
        }
        new Image().src = 'https://polsia.com/api/beacon/pixel?s=' + encodeURIComponent(slug) + '&v=' + encodeURIComponent(vid);
    })();
    </script>
